name: Build AlterTrack APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      # La version de l'APK suit le tag (v1.2.3 -> version 1.2.3, versionCode 10203).
      # L'app la compare à la dernière release pour afficher « Nouvelle version disponible ».
      - name: Set app version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const file = 'apps/mobile/app.json';
            const cfg = JSON.parse(fs.readFileSync(file, 'utf8'));
            const [maj, min, pat] = process.argv[1].split('-')[0].split('.').map((n) => parseInt(n, 10) || 0);
            cfg.expo.version = process.argv[1];
            cfg.expo.android.versionCode = maj * 10000 + min * 100 + pat;
            fs.writeFileSync(file, JSON.stringify(cfg, null, 2) + '\n');
            console.log('Version', cfg.expo.version, 'versionCode', cfg.expo.android.versionCode);
          " "$VERSION"

      - name: Build Android APK (Expo / Gradle)
        env:
          EXPO_PUBLIC_API_URL: https://altertrack.onrender.com
          EXPO_PUBLIC_API_KEY: 8f3b7c9a2d5e1f406b8e3a9c2d7f1e504b8a2c6d9e3f0a7b1c4d8e2f5a9b0c3d
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4608m"
        run: |
          cd apps/mobile
          npx expo prebuild --platform android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      # Nom du fichier téléchargé par les utilisateurs : AlterTrack-v1.3.0.apk
      - name: Rename APK with version
        run: |
          mv apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
             "apps/mobile/android/app/build/outputs/apk/release/AlterTrack-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/android/app/build/outputs/apk/release/AlterTrack-${{ github.ref_name }}.apk
          tag_name: ${{ github.ref_name }}
          name: AlterTrack ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}