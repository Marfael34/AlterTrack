services:
  postgres:
    image: postgres:16-alpine
    container_name: altertrack-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-altertrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-altertrack_secret_dev}
      POSTGRES_DB: ${POSTGRES_DB:-altertrack_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-altertrack} -d ${POSTGRES_DB:-altertrack_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - altertrack-net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: altertrack-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-altertrack}:${POSTGRES_PASSWORD:-altertrack_secret_dev}@postgres:5432/${POSTGRES_DB:-altertrack_db}?schema=public
      API_KEY: ${API_KEY}
      UPLOAD_DIR: /app/uploads
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - api_uploads:/app/uploads
    networks:
      - altertrack-net

volumes:
  postgres_data:
  api_uploads:

networks:
  altertrack-net:
    driver: bridge
