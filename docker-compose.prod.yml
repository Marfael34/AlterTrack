# ==============================================================================
# AlterTrack - Docker Compose pour Déploiement en Production
# Usage : docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: altertrack-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # En production, aucun port n'est exposé vers l'extérieur pour protéger la base de données
    expose:
      - "5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./scripts/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - altertrack-prod-net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: altertrack-api-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      API_KEY: ${API_KEY}
      UPLOAD_DIR: /app/uploads
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      # Expose sur localhost pour être servi via un Reverse Proxy Nginx ou Caddy avec certificat SSL
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - api_prod_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - altertrack-prod-net

volumes:
  postgres_prod_data:
  api_prod_uploads:

networks:
  altertrack-prod-net:
    driver: bridge
