# ==============================================================================
# Configuration Netlify - AlterTrack Web (Expo React Native)
# ==============================================================================

[build]
  # Répertoire racine du projet mobile/web dans le monorepo
  base = "apps/mobile"
  # Dossier exporté contenant les fichiers statiques compilés
  publish = "dist"
  # Commande de build d'exportation web statique
  command = "npm run build:web"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Redirection Single Page Application (SPA) pour React Native / Expo Web
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# En-têtes HTTP de sécurité renforcés
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Mise en cache optimale des assets immuables Expo
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
